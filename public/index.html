<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ПРОТОКОЛ: РЕЙ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #0a1628; --panel: #12223d; --panel-2: #1a2d4d; --line: #2a4a7a;
  --rei-blue: #4fc3f7; --rei-glow: rgba(79, 195, 247, 0.5);
  --rei-red: #ff1744; --rei-red-glow: rgba(255, 23, 68, 0.5);
  --rei-white: #e3f2fd;
  --magi: #69f0ae; --magi-glow: rgba(105, 240, 174, 0.4);
  --text: #e3f2fd; --text-dim: #7a9cc6;
  --font-display: 'Press Start 2P', monospace; --font-body: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: #000; font-family: var(--font-body); color: var(--text); }
.app { 
  max-width: 600px; margin: 0 auto; padding: 12px; min-height: 100vh;
  display: flex; flex-direction: column;
}
.header { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 12px 0; border-bottom: 2px solid var(--line); margin-bottom: 16px;
}
.title { font-family: var(--font-display); font-size: 14px; color: var(--rei-blue); text-shadow: 0 0 8px var(--rei-glow); }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { 
  flex: 1; padding: 10px; background: var(--panel); border: 1px solid var(--line); 
  color: var(--text-dim); font-family: var(--font-display); font-size: 10px; 
  cursor: pointer; text-align: center; transition: all 0.2s;
}
.tab.active { background: var(--panel-2); color: var(--rei-blue); border-color: var(--rei-blue); box-shadow: 0 0 8px var(--rei-glow); }
.view { display: none; }
.view.active { display: block; }
.card { 
  background: var(--panel); border: 1px solid var(--line); padding: 16px; 
  margin-bottom: 12px; border-radius: 4px; position: relative;
}
.card.playing { border-color: var(--rei-red); box-shadow: 0 0 12px var(--rei-red-glow); }
.card.finished { border-color: var(--magi); box-shadow: 0 0 12px var(--magi-glow); }
.section-title { 
  font-family: var(--font-display); font-size: 12px; color: var(--rei-blue); 
  margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px;
}
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: bold; }
.field input, .field select { 
  width: 100%; padding: 10px; background: var(--void); border: 1px solid var(--line); 
  color: var(--text); font-family: var(--font-body); font-size: 14px; border-radius: 4px;
}
.field input:focus { outline: none; border-color: var(--rei-blue); box-shadow: 0 0 8px var(--rei-glow); }
.hint { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
.err { font-size: 11px; color: var(--rei-red); margin-top: 8px; min-height: 16px; }
.btn-row { display: flex; gap: 8px; margin-top: 16px; }
.btn { 
  flex: 1; padding: 12px; border: none; font-family: var(--font-display); font-size: 10px; 
  cursor: pointer; border-radius: 4px; transition: all 0.2s; text-transform: uppercase;
}
.btn-primary { background: var(--rei-blue); color: var(--void); box-shadow: 0 0 8px var(--rei-glow); }
.btn-primary:hover { background: #81d4fa; }
.btn-cyan { background: var(--panel-2); color: var(--rei-blue); border: 1px solid var(--rei-blue); }
.btn-cyan:hover { background: var(--rei-blue); color: var(--void); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--text); color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.player-row { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 8px 0; border-bottom: 1px solid var(--line);
}
.player-row:last-child { border-bottom: none; }
.player-name { font-weight: bold; font-size: 13px; }
.player-name.me { color: var(--rei-blue); }
.player-status { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.status-alive { background: rgba(105, 240, 174, 0.2); color: var(--magi); }
.status-dead { background: rgba(255, 23, 68, 0.2); color: var(--rei-red); }
.log-container { 
  background: var(--void); border: 1px solid var(--line); padding: 12px; 
  height: 200px; overflow-y: auto; font-size: 11px; border-radius: 4px;
}
.log-entry { margin-bottom: 6px; line-height: 1.4; }
.log-entry.hit { color: var(--rei-red); font-weight: bold; }
.log-entry.sys { color: var(--rei-blue); }
.log-entry.anomaly { color: #ff0; font-weight: bold; }
.empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px 0; }
.overlay { 
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
  background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; 
  z-index: 100; padding: 16px;
}
.modal { 
  background: var(--panel); border: 2px solid var(--rei-blue); padding: 20px; 
  border-radius: 8px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 0 24px var(--rei-glow);
}
.avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.avatar-item { 
  background: var(--void); border: 1px solid var(--line); padding: 8px; 
  text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s;
}
.avatar-item:hover { border-color: var(--rei-blue); }
.avatar-item.locked { opacity: 0.4; cursor: not-allowed; }
.avatar-item img { width: 48px; height: 48px; border-radius: 50%; margin-bottom: 4px; }
.avatar-item .name { font-size: 9px; color: var(--text-dim); }
.target-info { 
  text-align: center; font-family: var(--font-display); font-size: 12px; 
  color: var(--rei-red); margin-bottom: 12px; text-shadow: 0 0 8px var(--rei-red-glow);
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">ПРОТОКОЛ: РЕЙ</div>
    <div id="user-info" style="font-size: 11px; color: var(--text-dim);"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="battle">БИТВА</div>
    <div class="tab" data-tab="create">СОЗДАТЬ</div>
    <div class="tab" data-tab="profile">ПРОФИЛЬ</div>
  </div>

  <div id="view-battle" class="view active"></div>
  <div id="view-create" class="view"></div>
  <div id="view-profile" class="view"></div>
</div>

<script>
const ME_ID = window.telegram.WebApp.initDataUnsafe?.user?.id?.toString() || '0';
window.telegram.WebApp.ready();
window.telegram.WebApp.expand();

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'X-Init-Data': window.telegram.WebApp.initData || '',
      ...(opts.headers || {})
    }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Ошибка сети');
  return data;
}

let state = { tab: 'battle', openBattleId: null, modalOpen: false, battles: [], profile: null, err: null,
  profileTab: 'overview', createForm: { prize: '', minutes: 2, max: 5, winners: 1, blanks: 10, anomalyMadness: false, anomalyExecutioner: false },
  isOwner: false, canCreate: false, allowedList: [] };
let pollTimer = null;
const AVATAR_KEYS = ['default', 'glasses', 'card'];

function avatarImg(key, px) {
  const img = document.createElement('img');
  img.src = `/avatars/${key}.png`;
  img.style.width = px + 'px';
  img.style.height = px + 'px';
  img.style.borderRadius = '50%';
  img.style.objectFit = 'cover';
  return img;
}

function act(fn) {
  state.err = null;
  render();
  return fn().catch(e => { state.err = e.message; render(); });
}

function render() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === state.tab);
  });
  document.querySelectorAll('.view').forEach(v => {
    v.classList.toggle('active', v.id === `view-${state.tab}`);
  });
  
  const userInfo = document.getElementById('user-info');
  if (state.profile) {
    userInfo.textContent = state.profile.name;
  }

  const battleView = document.getElementById('view-battle');
  const createView = document.getElementById('view-create');
  const profileView = document.getElementById('view-profile');

  battleView.innerHTML = '';
  createView.innerHTML = '';
  profileView.innerHTML = '';

  if (state.tab === 'battle') {
    if (state.openBattleId) {
      const b = state.battles.find(x => x.id === state.openBattleId);
      if (b) {
        battleView.appendChild(renderBattle(b));
      } else {
        battleView.innerHTML = '<div class="empty">Битва не найдена</div>';
      }
    } else {
      battleView.innerHTML = '<div class="empty">Выберите битву из списка или создайте новую</div>';
      const list = document.createElement('div');
      state.battles.forEach(b => {
        list.appendChild(renderBattleCard(b, true));
      });
      battleView.appendChild(list);
    }
  } else if (state.tab === 'create') {
    createView.appendChild(renderCreate());
  } else if (state.tab === 'profile') {
    profileView.appendChild(renderProfile());
  }

  if (state.modalOpen) {
    document.body.appendChild(renderModal());
  }
}

function renderBattleCard(b, compact = false) {
  const card = document.createElement('div');
  card.className = `card ${b.status === 'playing' ? 'playing' : (b.status === 'finished' ? 'finished' : '')}`;
  
  const header = document.createElement('div');
  header.style.display = 'flex';
  header.style.justifyContent = 'space-between';
  header.style.marginBottom = '8px';
  
  const title = document.createElement('div');
  title.className = 'section-title';
  title.style.margin = '0';
  title.textContent = `БИТВА #${b.id}`;
  
  const status = document.createElement('div');
  status.style.fontSize = '10px';
  status.style.color = b.status === 'playing' ? 'var(--rei-red)' : (b.status === 'finished' ? 'var(--magi)' : 'var(--text-dim)');
  status.textContent = b.status === 'playing' ? 'ИДЁТ' : (b.status === 'finished' ? 'ЗАВЕРШЕНА' : 'ЛОББИ');
  
  header.appendChild(title);
  header.appendChild(status);
  card.appendChild(header);

  const prize = document.createElement('div');
  prize.style.fontSize = '14px';
  prize.style.fontWeight = 'bold';
  prize.style.marginBottom = '8px';
  prize.textContent = `ПРИЗ: ${b.prize}`;
  card.appendChild(prize);

  const players = document.createElement('div');
  players.style.fontSize = '11px';
  players.style.color = 'var(--text-dim)';
  players.style.marginBottom = '12px';
  players.textContent = `ПИЛОТЫ: ${b.players.length}/${b.maxPlayers}`;
  card.appendChild(players);

  if (!compact) {
    const pList = document.createElement('div');
    pList.style.marginBottom = '12px';
    b.players.forEach(p => {
      const row = document.createElement('div');
      row.className = 'player-row';
      const name = document.createElement('div');
      name.className = `player-name ${p.user_id === ME_ID ? 'me' : ''}`;
      name.textContent = p.name + (p.user_id === ME_ID ? ' (ТЫ)' : '');
      const st = document.createElement('div');
      st.className = `player-status ${p.alive ? 'status-alive' : 'status-dead'}`;
      st.textContent = p.alive ? 'ЖИВ' : (p.place ? `${p.place} МЕСТО` : 'ВЫБЫЛ');
      row.appendChild(name);
      row.appendChild(st);
      pList.appendChild(row);
    });
    card.appendChild(pList);
  }

  const foot = document.createElement('div');
  foot.className = 'btn-row';
  foot.style.marginTop = '12px';
  
  if (b.status === 'lobby') {
    const already = b.players.some(p => p.user_id === ME_ID);
    const full = b.players.length >= b.maxPlayers;
    const joinBtn = document.createElement('button');
    joinBtn.className = 'btn btn-primary';
    joinBtn.style.flex = '1';
    joinBtn.textContent = already ? 'Ты в игре' : (full ? 'Мест нет' : 'Присоединиться');
    joinBtn.disabled = already || full;
    joinBtn.onclick = async () => {
      await act(() => api(`/battles/${b.id}/join`, { method: 'POST' }));
      state.openBattleId = b.id;
      state.tab = 'battle';
      render();
    };
    foot.appendChild(joinBtn);
    card.appendChild(foot);
  } else {
    card.style.cursor = 'pointer';
    card.onclick = () => { state.openBattleId = b.id; state.tab = 'battle'; render(); };
  }

  return card;
}

function renderBattle(b) {
  const wrap = document.createElement('div');
  
  const header = document.createElement('div');
  header.style.display = 'flex';
  header.style.justifyContent = 'space-between';
  header.style.alignItems = 'center';
  header.style.marginBottom = '12px';
  
  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-ghost';
  backBtn.style.flex = '0';
  backBtn.style.padding = '8px 12px';
  backBtn.textContent = '←';
  backBtn.onclick = () => { state.openBattleId = null; render(); };
  
  const title = document.createElement('div');
  title.className = 'section-title';
  title.style.margin = '0';
  title.textContent = `БИТВА #${b.id}`;
  
  header.appendChild(backBtn);
  header.appendChild(title);
  header.appendChild(document.createElement('div')); // spacer
  wrap.appendChild(header);

  const pList = document.createElement('div');
  pList.style.marginBottom = '12px';
  b.players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'player-row';
    const left = document.createElement('div');
    left.style.display = 'flex';
    left.style.alignItems = 'center';
    left.style.gap = '8px';
    left.appendChild(avatarImg(p.avatar, 24));
    const name = document.createElement('div');
    name.className = `player-name ${p.user_id === ME_ID ? 'me' : ''}`;
    name.textContent = p.name + (p.user_id === ME_ID ? ' (ТЫ)' : '');
    left.appendChild(name);
    
    const st = document.createElement('div');
    st.className = `player-status ${p.alive ? 'status-alive' : 'status-dead'}`;
    st.textContent = p.alive ? 'ЖИВ' : (p.place ? `${p.place} МЕСТО` : 'ВЫБЫЛ');
    
    row.appendChild(left);
    row.appendChild(st);
    pList.appendChild(row);
  });
  wrap.appendChild(pList);

  if (b.status === 'playing') {
    const isMyTurn = b.turnUserId === ME_ID;
    const me = b.players.find(p => p.user_id === ME_ID);
    
    if (isMyTurn && me?.alive) {
      const turnInfo = document.createElement('div');
      turnInfo.className = 'target-info';
      turnInfo.textContent = 'ТВОЙ ХОД';
      wrap.appendChild(turnInfo);

      if (b.targetUserId === ME_ID) {
        const targetInfo = document.createElement('div');
        targetInfo.className = 'target-info';
        targetInfo.textContent = `ЦЕЛЬ: ТЫ САМ`;
        wrap.appendChild(targetInfo);
      }

      const controls = document.createElement('div'); controls.style.marginTop = '0'; controls.className = 'btn-row';
      
      if (b.currentAnomaly === 'madness') {
        const info = document.createElement('div');
        info.className = 'hint';
        info.style.color = 'var(--rei-red)';
        info.style.textAlign = 'center';
        info.style.marginBottom = '8px';
        info.textContent = '🌀 Твой выбор ничего не решает.';
        wrap.appendChild(info);
        const madnessBtn = document.createElement('button');
        madnessBtn.className = 'btn btn-primary';
        madnessBtn.style.flex = '1';
        madnessBtn.textContent = 'ВЫСТРЕЛ';
        madnessBtn.onclick = () => act(() => api(`/battles/${b.id}/shoot-madness`, { method: 'POST' }));
        controls.appendChild(madnessBtn);
      } else if (b.currentAnomaly === 'executioner' && b.executionerTargets && b.executionerTargets.length > 0) {
        const info = document.createElement('div');
        info.className = 'hint';
        info.style.color = 'var(--rei-red)';
        info.style.textAlign = 'center';
        info.style.marginBottom = '8px';
        info.textContent = '🌀 Выбери жертву:';
        wrap.appendChild(info);
        b.executionerTargets.forEach(target => {
          const execBtn = document.createElement('button');
          execBtn.className = 'btn btn-cyan';
          execBtn.style.flex = '1';
          execBtn.style.marginBottom = '8px';
          execBtn.textContent = `УБИТЬ: ${target.name}`;
          execBtn.onclick = () => act(() => api(`/battles/${b.id}/execute`, { method: 'POST', body: { targetUserId: target.user_id } }));
          controls.appendChild(execBtn);
        });
      } else {
        const selfBtn = document.createElement('button'); selfBtn.className = 'btn btn-primary'; selfBtn.style.flex = '1';
        selfBtn.textContent = 'В СЕБЯ'; selfBtn.onclick = () => act(() => api(`/battles/${b.id}/shoot-self`, { method: 'POST' }));
        const otherBtn = document.createElement('button'); otherBtn.className = 'btn btn-cyan'; otherBtn.style.flex = '1';
        otherBtn.textContent = 'В ДРУГОГО'; otherBtn.onclick = () => act(() => api(`/battles/${b.id}/shoot-other`, { method: 'POST' }));
        controls.appendChild(selfBtn); controls.appendChild(otherBtn);
      }
      wrap.appendChild(controls);
    } else {
      const wait = document.createElement('div'); wait.className = 'empty'; wait.style.marginTop = '8px';
      const turnPlayer = b.players.find(p => p.user_id === b.turnUserId);
      const secsLeft = b.turnStartedAt ? Math.max(0, 15 - Math.floor((Date.now() - b.turnStartedAt) / 1000)) : 15;
      wait.textContent = `${turnPlayer ? turnPlayer.name : 'Пилот'} думает... (${secsLeft} с)`;
      wrap.appendChild(wait);
    }
  } else if (b.status === 'finished') {
    const results = document.createElement('div'); results.innerHTML = `<h2 class="section-title">РЕЗУЛЬТАТЫ</h2>`;
    const winners = b.players.filter(p => p.place <= b.winnersCount).sort((a,b) => a.place - b.place);
    if (winners.length > 0) {
      const wDiv = document.createElement('div');
      wDiv.style.color = 'var(--magi)';
      wDiv.style.marginBottom = '12px';
      wDiv.textContent = `ПОБЕДИТЕЛИ: ${winners.map(p => p.name).join(', ')}`;
      results.appendChild(wDiv);
    }
    wrap.appendChild(results);
  }

  const logTitle = document.createElement('div');
  logTitle.className = 'section-title';
  logTitle.textContent = 'ЖУРНАЛ';
  logTitle.style.marginTop = '16px';
  wrap.appendChild(logTitle);

  const logContainer = document.createElement('div');
  logContainer.className = 'log-container';
  b.log.forEach(l => {
    const entry = document.createElement('div');
    entry.className = `log-entry ${l.cls || ''}`;
    entry.textContent = l.text;
    logContainer.appendChild(entry);
  });
  logContainer.scrollTop = logContainer.scrollHeight;
  wrap.appendChild(logContainer);

  return wrap;
}

function renderCreate() {
  const wrap = document.createElement('div');
  if (!state.canCreate) {
    wrap.innerHTML = '<div class="empty">У тебя нет прав создавать битвы. Обратись к администратору клуба.</div>';
    return wrap;
  }
  
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.textContent = '+ НОВАЯ БИТВА';
  btn.onclick = () => { state.modalOpen = true; render(); };
  wrap.appendChild(btn);

  const list = document.createElement('div');
  list.style.marginTop = '16px';
  state.battles.filter(b => b.status === 'lobby').forEach(b => {
    list.appendChild(renderBattleCard(b));
  });
  if (list.children.length === 0) {
    list.innerHTML = '<div class="empty">Нет активных лобби</div>';
  }
  wrap.appendChild(list);
  return wrap;
}

const CREATE_FIELDS = [
  { id: 'f-prize', key: 'prize', type: 'text' },
  { id: 'f-minutes', key: 'minutes', type: 'number' },
  { id: 'f-max', key: 'max', type: 'number' },
  { id: 'f-winners', key: 'winners', type: 'number' },
  { id: 'f-blanks', key: 'blanks', type: 'number' },
];

function resetCreateForm() {
  state.createForm = { prize: '', minutes: 2, max: 5, winners: 1, blanks: 10, anomalyMadness: false, anomalyExecutioner: false };
}

function renderAdmin() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<h2 class="section-title">КОМАНДОВАНИЕ NERV</h2>
    <div class="hint" style="margin-bottom:12px;">Командир всегда может создавать битвы. Добавь сюда пилотов по ID или имени.</div>
    <div class="field"><label>Добавить пилота (ID или @username)</label>
    <input id="admin-add" type="text" placeholder="123456789 или @name">
    <div class="btn-row" style="margin-top:8px;">
    <button class="btn btn-primary" id="admin-add-btn">Добавить</button>
    </div></div>
    <div class="err" id="admin-err"></div>
    <h3 class="section-title" style="margin-top:24px;">СПИСОК ДОПУЩЕННЫХ</h3>
    <div id="admin-list"></div>`;
  
  const list = wrap.querySelector('#admin-list');
  state.allowedList.forEach(a => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `<span>${a.label}</span>`;
    const del = document.createElement('button');
    del.className = 'btn btn-ghost';
    del.style.flex = '0';
    del.style.padding = '4px 8px';
    del.textContent = 'X';
    del.onclick = () => act(async () => {
      await api(`/admin/allowed/${encodeURIComponent(a.identifier)}`, { method: 'DELETE' });
      await refresh();
    });
    row.appendChild(del);
    list.appendChild(row);
  });

  wrap.querySelector('#admin-add-btn').onclick = () => {
    const val = wrap.querySelector('#admin-add').value.trim();
    if (!val) return;
    act(async () => {
      await api('/admin/allowed', { method: 'POST', body: { identifier: val, label: val } });
      wrap.querySelector('#admin-add').value = '';
      await refresh();
    }).catch(e => { wrap.querySelector('#admin-err').textContent = e.message; });
  };

  return wrap;
}

function renderProfile() {
  const wrap = document.createElement('div');
  if (!state.profile) return wrap;

  const p = state.profile;
  const card = document.createElement('div');
  card.className = 'card';
  
  const top = document.createElement('div');
  top.style.display = 'flex';
  top.style.alignItems = 'center';
  top.style.gap = '16px';
  top.appendChild(avatarImg(p.avatar, 64));
  
  const info = document.createElement('div');
  info.innerHTML = `<div style="font-size:16px; font-weight:bold; margin-bottom:4px;">${p.name}</div>
    <div style="font-size:12px; color:var(--text-dim);">Побед: ${p.wins} / ${p.total} (Винрейт: ${p.winRate}%)</div>`;
  top.appendChild(info);
  card.appendChild(top);

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.style.marginTop = '16px';
  tabs.innerHTML = `<div class="tab ${state.profileTab === 'overview' ? 'active' : ''}" data-ptab="overview">ОБЗОР</div>
    <div class="tab ${state.profileTab === 'avatars' ? 'active' : ''}" data-ptab="avatars">АКСЕССУАРЫ</div>
    ${state.isOwner ? '<div class="tab" data-ptab="admin">АДМИН</div>' : ''}`;
  card.appendChild(tabs);

  tabs.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.profileTab = t.dataset.ptab; render(); };
  });

  const content = document.createElement('div');
  content.style.marginTop = '16px';

  if (state.profileTab === 'overview') {
    if (p.history.length === 0) {
      content.innerHTML = '<div class="empty">История пуста</div>';
    } else {
      p.history.slice(0, 10).forEach(h => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `<span style="color:${h.win ? 'var(--magi)' : 'var(--text-dim)'}">${h.prize}</span>
          <span class="player-status ${h.win ? 'status-alive' : 'status-dead'}">${h.place} место</span>`;
        content.appendChild(row);
      });
    }
  } else if (state.profileTab === 'avatars') {
    const grid = document.createElement('div');
    grid.className = 'avatar-grid';
    AVATAR_KEYS.forEach(key => {
      const meta = { default: {title: 'Стандарт', req: 0}, glasses: {title: 'Очки', req: 10}, card: {title: 'Карта', req: 100} }[key];
      const unlocked = p.total >= meta.req;
      const item = document.createElement('div');
      item.className = `avatar-item ${!unlocked ? 'locked' : ''}`;
      if (key === p.avatar) item.style.borderColor = 'var(--rei-blue)';
      item.innerHTML = `<div style="margin-bottom:4px;">${avatarImg(key, 48).outerHTML}</div>
        <div class="name">${meta.title}</div>
        <div class="name" style="color:${unlocked ? 'var(--magi)' : 'var(--rei-red)'}">${unlocked ? '✅' : meta.req + ' игр'}</div>`;
      if (unlocked && key !== p.avatar) {
        item.onclick = () => act(async () => {
          await api('/avatar', { method: 'POST', body: { avatar: key } });
          await refresh();
        });
      }
      grid.appendChild(item);
    });
    content.appendChild(grid);
  } else if (state.profileTab === 'admin' && state.isOwner) {
    content.appendChild(renderAdmin());
  }

  card.appendChild(content);
  wrap.appendChild(card);
  return wrap;
}

function renderModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  
  const f = state.createForm;
  modal.innerHTML = `<h2 class="section-title">НОВАЯ БИТВА</h2>
    <div class="field"><label>Приз</label><input id="f-prize" type="text" value="${f.prize}" placeholder="Например: 100 звезд"></div>
    <div class="field"><label>Минут до старта</label><input id="f-minutes" type="number" min="1" value="${f.minutes}">
    <div class="hint">Минимум 1.</div></div>
    <div class="field"><label>Макс. пилотов</label><input id="f-max" type="number" min="2" value="${f.max}">
    <div class="hint">Минимум 2.</div></div>
    <div class="field"><label>Выживших</label><input id="f-winners" type="number" min="1" value="${f.winners}">
    <div class="hint">Меньше макс. пилотов.</div></div>
    <div class="field"><label>Холостых</label><input id="f-blanks" type="number" min="10" value="${f.blanks}">
    <div class="hint">Минимум 10.</div></div>
    <div class="field" style="margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px;">
      <label style="color: var(--rei-blue); font-weight: bold; margin-bottom: 8px; display: block;">🌀 АНОМАЛИИ (необязательно)</label>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="f-anomaly-madness" style="transform: scale(1.2);"> 
          <span>БЕЗУМИЕ (случайная цель)</span>
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="f-anomaly-executioner" style="transform: scale(1.2);"> 
          <span>ВЫБОР ПАЛАЧА (мгновенная казнь)</span>
        </label>
      </div>
    </div>
    <div class="err" id="f-err"></div>
    <div class="btn-row">
    <button class="btn btn-ghost" style="flex:1;" id="f-cancel">Отмена</button>
    <button class="btn btn-primary" style="flex:1;" id="f-submit">Запуск</button>
    </div>`;
  overlay.appendChild(modal);
  
  const submit = async () => {
    const data = {
      prize: state.createForm.prize,
      minutes: parseInt(state.createForm.minutes || 0),
      maxPlayers: parseInt(state.createForm.max || 0),
      winnersCount: parseInt(state.createForm.winners || 0),
      blanksCount: parseInt(state.createForm.blanks || 0),
      anomalyMadness: state.createForm.anomalyMadness,
      anomalyExecutioner: state.createForm.anomalyExecutioner,
    };
    try {
      const newBattle = await api('/battles', { method: 'POST', body: data });
      state.modalOpen = false;
      resetCreateForm();
      state.openBattleId = newBattle.id;
      state.tab = 'battle';
      await refresh();
    } catch (e) { modal.querySelector('#f-err').textContent = e.message; }
  };
  
  CREATE_FIELDS.forEach((fld, idx) => {
    const input = modal.querySelector('#' + fld.id);
    input.oninput = () => { state.createForm[fld.key] = input.value; };
    input.onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const next = CREATE_FIELDS[idx + 1];
      if (next) { modal.querySelector('#' + next.id).focus(); }
      else { submit(); }
    };
  });
  
  const madnessChk = modal.querySelector('#f-anomaly-madness');
  madnessChk.onchange = () => { state.createForm.anomalyMadness = madnessChk.checked; };
  const execChk = modal.querySelector('#f-anomaly-executioner');
  execChk.onchange = () => { state.createForm.anomalyExecutioner = execChk.checked; };
  
  overlay.onclick = (e) => { if (e.target === overlay) { state.modalOpen = false; render(); } };
  modal.querySelector('#f-cancel').onclick = () => { state.modalOpen = false; render(); };
  modal.querySelector('#f-submit').onclick = submit;
  return overlay;
}

async function refresh() {
  try {
    const [battles, profile] = await Promise.all([
      api('/battles'),
      api('/me')
    ]);
    state.battles = battles;
    state.profile = profile;
    state.isOwner = profile.isOwner;
    state.canCreate = profile.canCreate;
    if (profile.isOwner) {
      state.allowedList = await api('/admin/allowed');
    }
    render();
  } catch (e) {
    console.error(e);
  }
}

function setupPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (state.openBattleId) {
      const b = state.battles.find(x => x.id === state.openBattleId);
      if (b && (b.status === 'playing' || b.status === 'finished')) {
        api(`/battles/${b.id}`).then(newB => {
          const idx = state.battles.findIndex(x => x.id === newB.id);
          if (idx !== -1) state.battles[idx] = newB;
          render();
        }).catch(() => {});
      }
    }
  }, 2000);
}

document.querySelectorAll('.tab[data-tab]').forEach(t => {
  t.onclick = () => {
    state.tab = t.dataset.tab;
    if (state.tab !== 'battle') state.openBattleId = null;
    render();
  };
});

refresh();
setupPolling();
</script>
</body>
</html>
